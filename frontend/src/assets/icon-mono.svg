<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer Monochrome Shield -->
  <path d="M50 8 L84 20 C84 56 68 80 50 92 C32 80 16 56 16 20 Z" 
        stroke="#ffffff" 
        stroke-width="4" 
        stroke-linejoin="round"/>

  <!-- Inner Lattice Nodes -->
  <circle cx="50" cy="27" r="4.5" fill="#ffffff"/>
  <circle cx="34" cy="46" r="4" fill="#ffffff"/>
  <circle cx="66" cy="46" r="4" fill="#ffffff"/>
  <circle cx="50" cy="68" r="4" fill="#ffffff"/>

  <!-- Trust Connectors -->
  <line x1="50" y1="27" x2="34" y2="46" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="50" y1="27" x2="66" y2="46" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="34" y1="46" x2="50" y2="68" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="66" y1="46" x2="50" y2="68" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Central Core Hexagon -->
  <polygon points="50,38 60,45 60,57 50,64 40,57 40,45" 
           stroke="#ffffff" 
           stroke-width="2" 
           fill="none"/>

  <!-- Verified Check -->
  <path d="M46 51 L49 54 L55 47" 
        stroke="#ffffff" 
        stroke-width="2.4" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
