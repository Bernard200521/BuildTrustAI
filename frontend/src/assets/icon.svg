<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="10" y1="5" x2="90" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="45%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="30" y1="30" x2="70" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Protective Shield Frame -->
  <path d="M50 8 L84 20 C84 56 68 80 50 92 C32 80 16 56 16 20 Z" 
        fill="#0b1329" 
        stroke="url(#shieldGrad)" 
        stroke-width="3.5" 
        stroke-linejoin="round"/>

  <!-- Inner Concentric Supply-Chain Contour -->
  <path d="M50 16 L76 25 C76 52 63 72 50 82 C37 72 24 52 24 25 Z" 
        fill="#081020" 
        stroke="#134e4a" 
        stroke-width="1.5" 
        stroke-dasharray="3 3"/>

  <!-- Interconnected Supply-Chain Trust Lattice (Nodes and Links) -->
  <!-- Top Node -->
  <circle cx="50" cy="27" r="4.5" fill="#06b6d4" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Left Pipeline Node -->
  <circle cx="34" cy="46" r="4" fill="#0d9488" stroke="#ffffff" stroke-width="1.2"/>
  <!-- Right Pipeline Node -->
  <circle cx="66" cy="46" r="4" fill="#0d9488" stroke="#ffffff" stroke-width="1.2"/>
  <!-- Bottom Verification Anchor Node -->
  <circle cx="50" cy="68" r="4" fill="#10b981" stroke="#ffffff" stroke-width="1.2"/>

  <!-- Interconnecting Trust Vectors -->
  <line x1="50" y1="27" x2="34" y2="46" stroke="#06b6d4" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="50" y1="27" x2="66" y2="46" stroke="#06b6d4" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="34" y1="46" x2="50" y2="48" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/>
  <line x1="66" y1="46" x2="50" y2="48" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/>
  <line x1="34" y1="46" x2="50" y2="68" stroke="#10b981" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="66" y1="46" x2="50" y2="68" stroke="#10b981" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Central Verified Core Check/Lock Badge -->
  <polygon points="50,38 60,45 60,57 50,64 40,57 40,45" 
           fill="url(#coreGrad)" 
           stroke="#e0f2fe" 
           stroke-width="1.8"/>

  <!-- Crisp Verified Checkmark inside Central Node -->
  <path d="M46 51 L49 54 L55 47" 
        stroke="#ffffff" 
        stroke-width="2.2" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
