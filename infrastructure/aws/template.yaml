AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: BuildTrust AI - AWS Production Infrastructure (DynamoDB, S3, IAM, CloudWatch, App Runner)

Parameters:
  Environment:
    Type: String
    Default: staging
    AllowedValues: [development, staging, production]
    Description: Deployment target environment.
  AwsRegionParam:
    Type: String
    Default: ap-south-1
    Description: Configurable target AWS region.
  AppRunnerPort:
    Type: Number
    Default: 8000
    Description: FastAPI container port.

Resources:
  # ============================================================================
  # 1. DynamoDB: BuildTrust Single-Table Records
  # ============================================================================
  BuildTrustTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "BuildTrustRecords-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: BuildTrustAI
        - Key: Environment
          Value: !Ref Environment

  # ============================================================================
  # 2. Amazon S3: Release Artifacts & Evidence Vault
  # ============================================================================
  EvidenceVaultBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "buildtrust-vault-${AWS::AccountId}-${Environment}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: TransitionOldEvidenceToGlacier
            Status: Enabled
            NoncurrentVersionTransition:
              TransitionInDays: 90
              StorageClass: GLACIER
      Tags:
        - Key: Project
          Value: BuildTrustAI
        - Key: Environment
          Value: !Ref Environment

  # ============================================================================
  # 3. Amazon CloudWatch: Application Log Group
  # ============================================================================
  AppRunnerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apprunner/buildtrust-ai-${Environment}"
      RetentionInDays: 30

  # ============================================================================
  # 4. AWS IAM: Least-Privilege App Runner Instance Role
  # ============================================================================
  AppRunnerInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "BuildTrustAppRunnerInstanceRole-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BuildTrustLeastPrivilegeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # DynamoDB Least Privilege (Scoped to BuildTrustTable only)
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource: !GetAtt BuildTrustTable.Arn
              # S3 Least Privilege (Scoped to EvidenceVaultBucket only)
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt EvidenceVaultBucket.Arn
                  - !Sub "${EvidenceVaultBucket.Arn}/*"
              # CloudWatch Logs
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${AppRunnerLogGroup.Arn}:*"

Outputs:
  DynamoDBTableName:
    Description: DynamoDB table name for BuildTrust single-table design
    Value: !Ref BuildTrustTable
  S3BucketName:
    Description: Encrypted S3 bucket name for release artifacts and SBOM vault
    Value: !Ref EvidenceVaultBucket
  AppRunnerInstanceRoleArn:
    Description: Attached IAM Role ARN for container execution
    Value: !GetAtt AppRunnerInstanceRole.Arn
